# Remplacez "votre-domaine.com" par le vrai nom de domaine de l'entreprise.
# Sans domaine, vous pouvez laisser "_" pour accepter n'importe quelle adresse
# (utile en test avec juste l'IP du serveur).
server {
    listen 80;
    server_name votre-domaine.com;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Une fois un nom de domaine pointé vers le serveur, activez le HTTPS gratuit
# avec Certbot (Let's Encrypt) :
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d votre-domaine.com
# Certbot modifiera automatiquement ce fichier pour rediriger le port 80 vers 443.
