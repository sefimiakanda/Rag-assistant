[project]
name = "rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fidelemiakanda", email = "sefimiakanda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.4",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
rag-assistant = "rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
